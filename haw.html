<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Particle Heart</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);


// ==============================
// HEART EQUATION
// ==============================

function heart(a, scale) {

    const x =
        16 * Math.pow(Math.sin(a), 3) * scale;

    const y =
        -(
            13 * Math.cos(a)
            - 5 * Math.cos(2 * a)
            - 2 * Math.cos(3 * a)
            - Math.cos(4 * a)
        ) * scale;

    return { x, y };
}


// ==============================
// PARTICLES
// ==============================

const particles = [];

const COUNT = 15000;

for (let i = 0; i < COUNT; i++) {

    const a =
        Math.random() * Math.PI * 2;

    const scale =
        0.5 + Math.random() * 16;

    const target =
        heart(a, scale);


    // Start much farther away
    const distance =
        250 + Math.random() * 600;

    const startAngle =
        Math.random() * Math.PI * 2;


    const startX =
        Math.cos(startAngle) * distance;

    const startY =
        Math.sin(startAngle) * distance;


    // Direction of particle movement
    const direction =
        Math.atan2(
            target.y - startY,
            target.x - startX
        );


    particles.push({

        x: startX,
        y: startY,

        targetX: target.x,
        targetY: target.y,

        direction: direction,

        length:
            3 + Math.random() * 15,

        size:
            0.35 + Math.random() * 1.0,

        alpha:
            0.25 + Math.random() * 0.75,

        pink:
            105 + Math.random() * 110,

        delay:
            Math.random() * 2.2,

        speed:
            0.7 + Math.random() * 0.8
    });
}


// ==============================
// EASING
// ==============================

function easeOut(t) {

    return 1 -
        Math.pow(1 - t, 4);
}


// ==============================
// ANIMATION
// ==============================

let startTime =
    performance.now();


function animate(now) {

    // Dark trail
    ctx.fillStyle =
        "rgba(0, 0, 0, 0.13)";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    const elapsed =
        (now - startTime) / 1000;


    const formationTime = 7;


    const screenScale =
        Math.min(W, H) / 700;


    ctx.save();

    ctx.translate(
        W / 2,
        H / 2
    );

    ctx.scale(
        screenScale,
        screenScale
    );


    for (const p of particles) {


        // --------------------------
        // PARTICLE PROGRESS
        // --------------------------

        let progress =
            (elapsed - p.delay) /
            formationTime;

        progress =
            Math.max(
                0,
                Math.min(
                    1,
                    progress
                )
            );


        const eased =
            easeOut(progress);


        // --------------------------
        // POSITION
        // --------------------------

        let x =
            p.x +
            (p.targetX - p.x) *
            eased;

        let y =
            p.y +
            (p.targetY - p.y) *
            eased;


        // --------------------------
        // FAST INITIAL MOVEMENT
        // --------------------------

        if (progress < 0.8) {

            const energy =
                (1 - progress) *
                12;

            x +=
                Math.cos(p.direction) *
                energy;

            y +=
                Math.sin(p.direction) *
                energy;
        }


        // --------------------------
        // FINAL HEART SHIMMER
        // --------------------------

        if (progress >= 1) {

            const shimmer =
                Math.sin(
                    now * 0.003 +
                    p.targetX * 0.05
                ) * 0.8;

            x += shimmer;
            y += shimmer;
        }


        // --------------------------
        // PARTICLE TRAIL
        // --------------------------

        const trail =
            p.length *
            (1.8 - eased);


        let x2 =
            x -
            Math.cos(p.direction) *
            trail;

        let y2 =
            y -
            Math.sin(p.direction) *
            trail;


        // --------------------------
        // GLOW
        // --------------------------

        ctx.beginPath();

        ctx.moveTo(
            x2,
            y2
        );

        ctx.lineTo(
            x,
            y
        );


        ctx.strokeStyle =
            `rgba(
                255,
                ${Math.floor(p.pink)},
                225,
                ${p.alpha}
            )`;


        ctx.lineWidth =
            p.size;


        ctx.stroke();
    }


    ctx.restore();


    requestAnimationFrame(
        animate
    );
}


requestAnimationFrame(
    animate
);

</script>

</body>
</html>
